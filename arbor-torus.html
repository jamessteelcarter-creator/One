<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arbor Torus · Lighting studies</title>
<style>
  :root{--g:#39ff14;--txt:#b4f7cb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--txt);
    font:400 10px/1.4 "Helvetica Neue",Helvetica,Inter,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}
  canvas{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
  canvas:active{cursor:grabbing}
  #title{position:fixed;top:26px;left:30px;font-size:11px;letter-spacing:.46em;color:#d6ffe2}
  #title b{font-weight:400;color:var(--g);text-shadow:0 0 10px #39ff1499}
  #sub{position:fixed;top:46px;left:30px;font-size:8.5px;letter-spacing:.32em;opacity:.4}
  #panel{position:fixed;top:84px;left:30px;width:228px;max-height:calc(100vh - 150px);overflow-y:auto;scrollbar-width:none;opacity:.22}
  #panel:hover,#panel:focus-within{opacity:1}
  #panel.hide .body{display:none}
  #panel.hide{opacity:.55}
  #panel.hide:hover,#panel.hide:focus-within{opacity:1}
  #tg{background:none;border:0;padding:0;color:var(--txt);font:inherit;letter-spacing:inherit;opacity:.6;cursor:pointer}
  #tg:hover{opacity:1}
  hr{border:0;border-top:1px solid #39ff141c;margin:10px 0}
  .row{display:flex;justify-content:space-between;align-items:center;height:25px;cursor:pointer}
  .row>span:first-child{opacity:.7}
  input[type=range]{-webkit-appearance:none;appearance:none;width:118px;height:16px;margin:0;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:#39ff1440}
  input[type=range]::-moz-range-track{height:1px;background:#39ff1440}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;margin-top:-4px;border-radius:50%;
    background:#000;border:1px solid var(--g);box-shadow:0 0 8px #39ff1488}
  input[type=range]::-moz-range-thumb{width:8px;height:8px;border-radius:50%;background:#000;border:1px solid var(--g);box-shadow:0 0 8px #39ff1488}
  .sw{position:relative;width:26px;height:12px}
  .sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
  .sw i{position:absolute;inset:0;border:1px solid #39ff1450;border-radius:6px}
  .sw i:after{content:"";position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;background:#39ff1460;transition:.25s}
  .sw input:checked+i:after{left:16px;background:var(--g);box-shadow:0 0 6px var(--g)}
  .btns{display:flex;gap:6px;margin-top:10px}
  .btns button{flex:1;background:transparent;border:1px solid #39ff1430;color:var(--txt);font:inherit;letter-spacing:.2em;padding:7px 0;cursor:pointer;transition:.25s}
  .btns button:hover{border-color:var(--g);color:#fff;box-shadow:inset 0 0 12px #39ff1430}
  .btns button:disabled{opacity:.3;cursor:default}
  #cap{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);text-align:center;font-size:10px;letter-spacing:.55em;color:#d6ffe2;pointer-events:none;white-space:nowrap}
  #bar{width:170px;height:1px;margin:13px auto 0;background:#39ff1420;position:relative}
  #bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--g);box-shadow:0 0 6px var(--g)}
  #hint{position:fixed;right:30px;bottom:32px;font-size:8.5px;letter-spacing:.26em;line-height:2.1;text-align:right;opacity:.32;pointer-events:none}
  #title,#sub,#panel,#hint,#cap,#lightingbar{transition:opacity .9s}
  /* presentation mode: the interface steps away when you are not using it */
  body.idle #title,body.idle #sub,body.idle #panel,body.idle #hint,body.idle #lightingbar,
  body.noui #title,body.noui #sub,body.noui #panel,body.noui #hint,body.noui #lightingbar{opacity:0!important;pointer-events:none}
  body.idle #cap,body.noui #cap{opacity:.5}
  body.idle canvas{cursor:none}
  #nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;letter-spacing:.3em;line-height:2}
  @media (hover:none){#panel{opacity:.85}}
  @media (max-width:640px){#hint{display:none}#cap{bottom:20px}#panel{width:200px}input[type=range]{width:96px}}

  #lightingbar{position:fixed;top:22px;right:110px;display:flex;align-items:center;gap:12px;z-index:3;font-size:11px;letter-spacing:.12em}
  #lightingbar[hidden]{display:none}
  #lightingbar label{opacity:.72}
  #lighting{background:#07100c;color:#d6ffe2;border:1px solid #39ff1440;padding:8px 10px;font:400 12px Helvetica,Arial,sans-serif;letter-spacing:.02em;border-radius:2px;max-width:180px}
  #lighting:focus-visible{outline:2px solid #b4f7cb;outline-offset:3px}
  @media(max-width:740px){#lightingbar{top:68px;left:30px;right:auto}#panel{top:116px;max-height:calc(100vh - 184px)}#cap{white-space:normal;width:calc(100% - 32px);letter-spacing:.35em}}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Interactive Arbor to Torus artwork with three lighting treatments"></canvas>
<div id="lightingbar" hidden><label for="lighting">Lighting</label><select id="lighting" class="cursor-interaction" aria-label="Lighting treatment">
  <option value="0">Original</option>
  <option value="1">Sparse strands</option>
  <option value="2">Layered depth</option>
  <option value="3" selected>Travelling light</option>
</select></div>
<div id="title">Arbor <b>→</b> Torus</div>
<div id="sub">Twin fractal growth · toroidal closure</div>
<div id="panel" class="hide">
  <button id="tg" type="button" aria-expanded="false" aria-controls="controlbody lightingbar">+ Controls</button>
  <div class="body" id="controlbody">
    <hr>
    <label class="row"><span>Morph</span><input id="morph" type="range" min="0" max="1" step="0.001" value="0"></label>
    <label class="row"><span>Generations</span><input id="depth" type="range" min="8" max="15" step="1" value="15"></label>
    <label class="row"><span>Meridians</span><input id="mer" type="range" min="4" max="6" step="1" value="6"></label>
    <label class="row"><span>Fork angle</span><input id="spread" type="range" min="0.6" max="1.5" step="0.01" value="0.6"></label>
    <label class="row"><span>Length ratio</span><input id="ratio" type="range" min="0.7" max="0.88" step="0.005" value="0.88"></label>
    <label class="row"><span>Variation</span><input id="vari" type="range" min="0" max="0.5" step="0.01" value="0"></label>
    <label class="row"><span>Twist</span><input id="twist" type="range" min="-2" max="2" step="0.01" value="-2"></label>
    <label class="row"><span>Ring radius</span><input id="hole" type="range" min="0" max="0.6" step="0.01" value="0"></label>
    <label class="row"><span>Rings</span><input id="rings" type="range" min="8" max="40" step="1" value="22"></label>
    <label class="row"><span>Glow</span><input id="glow" type="range" min="0" max="2" step="0.01" value="1"></label>
    <label class="row"><span>Light shafts</span><input id="shafts" type="range" min="0" max="2" step="0.01" value="1"></label>
    <label class="row"><span>Reflection</span><input id="refl" type="range" min="0.25" max="1" step="0.01" value="0.7"></label>
    <label class="row"><span>Film</span><input id="film" type="range" min="0" max="1" step="0.01" value="1"></label>
    <label class="row"><span>Scale</span><input id="scale" type="range" min="0.3" max="30" step="0.01" value="1.14"></label>
    <hr>
    <label class="row"><span>Auto-play</span><span class="sw"><input id="auto" type="checkbox" checked><i></i></span></label>
    <label class="row"><span>Sound</span><span class="sw"><input id="sound" type="checkbox"><i></i></span></label>
    <label class="row"><span>Auto-spin</span><span class="sw"><input id="spin" type="checkbox"><i></i></span></label>
    <label class="row"><span>Flow</span><span class="sw"><input id="flow" type="checkbox" checked><i></i></span></label>
    <label class="row"><span>Flow speed</span><input id="speed" type="range" min="0.3" max="2.5" step="0.01" value="1"></label>
    <div class="btns"><button id="regrow">Regrow</button><button id="reseed">Reseed</button><button id="reset">View</button></div>
    <div class="btns"><button id="still">4K still</button><button id="record">Record</button></div>
  </div>
</div>
<div id="cap"><div id="phase">I · Genesis</div><div id="bar"><i id="barfill"></i></div></div>
<div id="hint">Drag · rotate<br>Shift / right-drag · roll<br>Scroll / pinch · zoom<br>Option / Alt-drag · pan<br>H · hide interface</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,premultipliedAlpha:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
if(!gl){document.body.insertAdjacentHTML('beforeend','<div id="nogl">This piece needs WebGL 2 — please open it in a current version of Chrome, Edge, Firefox or Safari.</div>');throw new Error('WebGL2 unavailable');}
const HALF=!!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
const GPU=HALF;          // float render targets: the morph and the flow both run on the graphics card

const TAU=Math.PI*2,M=96,TEXW=2048,FW=256;  // M = segments per root-to-tip path (= half a meridian); FW² flow particles
const KZ=3,ZG=2.8;   // torus is KZ× the tree's extent (the bloom zooms out KZ×); growth zooms out ZG× from the seed
const clamp01=x=>x<0?0:x>1?1:x,sm=x=>{x=clamp01(x);return x*x*(3-2*x);},lerp=(a,b,t)=>a+(b-a)*t;
const pos2pi=a=>((a%TAU)+TAU)%TAU;
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* =====================================================================
   GPU plumbing
   ===================================================================== */
let CW=1,CH=1,dpr=1;
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function program(vs,fs){const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name]=gl.getUniformLocation(p,a.name);}
  return {p,u};}
const PROJ=`
uniform mat3 uR;uniform float uSg,uS,uPF,uF,uRefl,uFloor,uTime;uniform vec2 uRes,uCtr;
float gDepth;     // depth below the water surface (reflected geometry only)
vec3 proj(vec3 p){float Y=uSg*p.y;gDepth=0.;
  if(uRefl>0.5){Y=2.*uFloor-Y;gDepth=(uFloor-Y)/uPF;
  }
  vec3 q=uR*vec3(p.x,Y,p.z);float k=uF/max(0.5,uF-q.z/uPF);return vec3(uCtr+vec2(q.x,-q.y)*uS*k,q.z);}
vec4 toClip(vec2 P){return vec4(P.x/uRes.x*2.-1.,1.-P.y/uRes.y*2.,0.,1.);}`;

/* Branches are drawn as instanced quads; each fragment measures its distance to a tapered
   capsule, which gives perfectly smooth lines of any thickness with flowing forks. Out of focus,
   the cross-section becomes a lens disc with a bright rim: bokeh rather than a plain blur. */
const COLLAPSE_CURVE=`
float collapseSoftness(float t){return smoothstep(0.025,0.22,t)*(1.-smoothstep(0.90,1.,t));}
vec3 flowingCurve(vec3 prev,vec3 a,vec3 b,vec3 next,float f,float t){
  float L=max(length(b-a),1e-6);
  vec3 ta=0.5*(b-prev),tb=0.5*(next-a);
  ta*=min(1.,1.5*L/max(length(ta),1e-6));tb*=min(1.,1.5*L/max(length(tb),1e-6));
  float f2=f*f,f3=f2*f;
  vec3 p=(2.*f3-3.*f2+1.)*a+(f3-2.*f2+f)*ta+(-2.*f3+3.*f2)*b+(f3-f2)*tb;
  return mix(mix(a,b,f),p,collapseSoftness(t));}`;
const LINE_VS=`#version 300 es
precision highp float;precision highp int;
layout(location=0) in vec2 aC;
layout(location=3) in vec4 aM;          // segment index j, generation at start, generation at end, kind
${PROJ}
uniform highp sampler2D uPos;           // every segment's live end points, computed on the GPU each frame
uniform int uMode,uDI,uDmI,uRh,uNGI,uParts;uniform int uOff[16],uNk[16],uPs[16],uOrd[64];
uniform float uG,uT,uW0,uDpr,uM,uD,uDm,uTwig,uFold,uRing,uShoot,uFlash,uDens;uniform highp int uLook;
out vec2 vP;out float vJ;flat out float vPath;
flat out vec2 vA,vB;flat out float vRA,vRB,vBlur,vW,vCap,vRing,vBorn,vFr;flat out vec3 vCol;
vec3 tex(int i){return texelFetch(uPos,ivec2(i%${TEXW},i/${TEXW}),0).xyz;}
${COLLAPSE_CURVE}
vec3 merPt(int g,int j){                // the point j (1…M) along meridian g
  int jj=j-1,k=0;for(int i=1;i<16;i++){if(i>uDI)break;if(jj>=uPs[i])k=i;}
  int s=k<=uDmI?g:g<<(k-uDmI);return tex((uOff[k]+s*uNk[k]+jj-uPs[k])*2+1);}
float wid(float gen,float jj){float age=clamp((uG-jj)/(uM*0.35),0.,1.);
  return max(0.08*uDpr,uW0*pow(0.7,gen)*(0.35+0.65*age));}     // continuous taper; branches thicken as they mature
void main(){
  vec3 aA,aB;vec4 m=aM;float fr,span=1.;vBorn=1.;vFr=0.;
  if(uMode==0){
    // Folded-away twigs need no curve samples.
    float kind=mod(m.w,10.);
    if(kind>0.5&&kind<1.5&&uTwig*mix(1.,exp2(uDm-floor(m.y+1e-4)),uFold)<0.003){gl_Position=vec4(2.,2.,2.,1.);return;}
    int i=gl_InstanceID/uParts;aA=tex(i*2);aB=tex(i*2+1);fr=clamp(uG-m.x,0.,1.);
    if(uParts>1){
      int k=int(floor(m.y+1e-4)),nk=uNk[k],s=(i-uOff[k])/nk,q=i-uOff[k]-s*nk;
      vec3 prev=aA-(aB-aA),next=aB+(aB-aA);
      if(q>0)prev=tex((i-1)*2);
      else if(k>0){int ps=k>uDmI?s>>1:s;prev=tex((uOff[k-1]+ps*uNk[k-1]+uNk[k-1]-1)*2);}
      if(q<nk-1)next=tex((i+1)*2+1);
      else if(k<uDI){int ns=k<uDmI?s:s<<1;next=tex((uOff[k+1]+ns*uNk[k+1])*2+1);}
      span=1./float(uParts);float f0=float(gl_InstanceID%uParts)*span,f1=f0+span;
      vec3 a=aA,b=aB;aA=flowingCurve(prev,a,b,next,f0,uT);aB=flowingCurve(prev,a,b,next,f1,uT);
      fr=clamp((fr-f0)/span,0.,1.);m.x+=f0;m.y=mix(aM.y,aM.z,f0);m.z=mix(aM.y,aM.z,f1);
      if(f1<0.999&&m.w>9.5)m.w-=10.;
    }
  }
  else{  // a latitude ring joins every meridian's point at one moment of the growth: the shape of the growth front
         // at that moment. It is laid down faintly inside the canopy as the front passes, stretched outward with the
         // canopy as it opens. At water contact, light spreads sideways between neighbouring meridians.
    int e=gl_InstanceID>>1,mm=e%uNGI,qr=e/uNGI+1,jr=int(floor(float(qr)*uM/float(uRh)+0.5));
    vec3 P0=merPt(uOrd[mm],jr),P1=merPt(uOrd[(mm+1)%uNGI],jr);
    bool s0=(gl_InstanceID&1)==0;vec3 Pm=s0?P0:P1,mid=0.5*(P0+P1);aA=Pm;
    vBorn=clamp((uG-float(jr)+4.)/4.,0.,1.);
    int kr=0;for(int i=1;i<16;i++){if(i>uDI)break;if(jr-1>=uPs[i])kr=i;}
    vBorn*=mix(kr>=uDmI?1.:0.,1.,smoothstep(0.15,0.5,uT));   // while the tree stands they live in the crown; the inner
                                                             // rings open out of the trunk as the meridians part
    // each meridian carries its piece of the ring: a short horizontal node, stretched sideways as the canopy opens
    vec3 T=vec3(-Pm.z,0.,Pm.x);float tl=length(T),hc=0.5*length(P1-P0);
    T=tl>1e-6?T/tl:vec3(1.,0.,0.);if(dot(T,(s0?P1:P0)-Pm)<0.)T=-T;
    float tick=min(hc*mix(0.25,0.45,uT),mix(0.004,0.012,uT)*uPF);
    if(uShoot<=0.){aB=Pm+T*tick;fr=vBorn>0.&&tick>1e-6?1.:0.;vFr=1.;}
    else{aB=mid;vFr=hc>1e-6?max(uShoot,tick/hc):1.;fr=vBorn>0.?vFr:0.;vFr=uShoot/max(vFr,1e-6);}
    m=vec4(float(jr),0.,0.,2.);}
  float j=m.x,kind=mod(m.w,10.);bool term=m.w>9.5,ring=kind>1.5&&kind<2.5;
  float w=1.,lv=floor(m.y+1e-4);
  if(kind>0.5&&kind<1.5)w=uTwig*mix(1.,exp2(uDm-lv),uFold);   // folded twigs share their strand's brightness: no stacking
  else if(ring)w=uRing;
  else if(lv<=uDm){                 // strands that start out coincident share one line's brightness until they separate
    float c=exp2(uDm-lv);w=uT<=0.?(kind>2.5?0.:1.):mix(1./c,1.,pow(uT,1.5));}
  if(fr<=0.||w<0.003){gl_Position=vec4(2.,2.,2.,1.);return;}
  vec3 pa=proj(aA);float da=gDepth;vec3 pb=proj(mix(aA,aB,fr));float dep=0.5*(da+gDepth);
  float ga=m.y,gb=mix(m.y,m.z,fr),rA,rB;
  if(ring){rA=rB=0.42*uDpr;}
  else{rA=0.5*mix(wid(ga,j),0.9*uDpr,uT);rB=0.5*mix(wid(gb,j+fr*span),0.9*uDpr,uT);}
  // These studies change illumination, not the geometry. Their influence
  // arrives late in the bloom so the original branching remains intact.
  vec3 midP=0.5*(aA+aB);
  float az=atan(midP.z,midP.x);
  float radial=length(midP.xz)/uPF;
  float study=smoothstep(0.55,0.98,uT);
  vPath=pow(0.5+0.5*cos(az*6.+0.3),12.)*smoothstep(0.025,0.13,radial);
  float zn=0.5*(pa.z+pb.z)/uPF;
  float blur=0.;                     // everything stays sharp
  float inten=w;
  if(uRefl>0.5)inten*=exp(-0.35*dep);
  float dz=clamp(0.5+0.5*zn,0.,1.);
  inten*=uDens*(0.18+0.82*pow(dz,1.3));
  if(!ring)inten*=mix(pow(0.75,max(0.,ga-6.)),1.,uT);   // finer generations add filigree, not brightness
  if(uLook==1){
    // Eight softly selected meridian families; the rest stay as faint traces.
    float selected=pow(0.5+0.5*cos(az*8.+0.45),7.);
    inten*=mix(1.,ring?0.18:0.12+1.28*selected,study);
    rA*=mix(1.,0.84,study);rB*=mix(1.,0.84,study);
  }else if(uLook==2){
    // Near strands carry the light. Far strands are cool and low in contrast.
    float depthGain=(0.045+1.22*pow(dz,2.4))/(0.18+0.82*pow(dz,1.3));
    inten*=mix(1.,depthGain*(ring?0.46:1.12),study);
    float nearWidth=mix(0.65,1.05,dz);
    rA*=mix(1.,nearWidth,study);rB*=mix(1.,nearWidth,study);
  }else if(uLook==3){
    // A subdued scaffold gives a few travelling paths space to be seen.
    inten*=mix(1.,ring?0.12:0.36,study);
  }
  if(uLook>0)inten*=1.-0.12*study*(1.-smoothstep(0.02,0.12,radial));
  // colour carries age: deep green trunk → pale new growth, blending into the torus
  vec3 ageC=mix(vec3(0.05,0.5,0.24),vec3(0.55,1.,0.66),pow(clamp(ga/uD,0.,1.),0.85));
  vec3 tor=vec3(0.3,1.,0.34);
  vec3 base=ring?tor:mix(ageC,tor,uT*0.85);
  base=mix(vec3(0.,0.42,0.3),base,0.35+0.65*dz);
  if(uLook==2){
    vec3 depthCol=mix(vec3(0.025,0.23,0.22),vec3(0.46,1.,0.60),smoothstep(0.10,0.92,dz));
    base=mix(base,depthCol,study*0.72);
  }
  vCol=base*inten*(ring?1.+uFlash:1.);vW=w*(uRefl>0.5?exp(-0.35*dep):1.);vRing=ring?1.:0.;   // a new ring gleams, then settles
  vec2 a=pa.xy,b=pb.xy,d=b-a;float L=length(d);d=L>1e-4?d/L:vec2(1.,0.);vec2 n=vec2(-d.y,d.x);
  vBlur=blur;
  float ext=max(max(rA,rB),0.5)+blur+2.;
  vec2 P=(aC.x<0.5?a-d*ext:b+d*ext)+n*aC.y*ext;
  vP=P;vA=a;vB=b;vRA=rA;vRB=rB;vJ=ring?j:mix(j,j+fr*span,aC.x);vCap=(term||fr<1.)?1.:0.;
  gl_Position=toClip(P);
}`;
const LINE_FS=`#version 300 es
precision highp float;
in vec2 vP;in float vJ;
flat in vec2 vA,vB;flat in float vRA,vRB,vBlur,vW,vCap,vRing,vBorn,vFr,vPath;flat in vec3 vCol;
uniform float uG,uM,uTrS,uTrA,uTrk,uShoot,uLat,uT,uTime;uniform highp int uLook;
out vec4 o;
void main(){
  vec2 ba=vB-vA,pa=vP-vA;float hr=dot(pa,ba)/max(dot(ba,ba),1e-6);

/* =====================================================================
   Glow points: the seed, growth buds, the flash at every division, the finished tips

let ptData=new Float32Array(7000),ptN=0,seedA=0;
function addPt(x,y,z,type,r,a){if(ptN*7+7>ptData.length){const n=new Float32Array(ptData.length*2);n.set(ptData);ptData=n;}

  if(seedA>0.01)addPt(0,0,0,1,2.8*dpr,seedA);

  const Rh=Math.max(2,Math.round(+$('rings').value/2)),ringN=2*Rh*NG,shoot=meetT>=0?sm(meetT/0.18):0;

      gl.uniform1iv(u['uOff[0]'],flowOff);gl.uniform1iv(u['uNk[0]'],flowNk);gl.uniform1iv(u['uPs[0]'],flowPs);gl.uniform1iv(u['uOrd[0]'],ordI);
      gl.uniform1f(u.uM,M);gl.uniform1f(u.uT,t);gl.uniform1f(u.uTrS,M/4*Math.min(meetT,0));gl.uniform1f(u.uHA,headA);gl.uniform1f(u.uDpr,dpr);gl.uniform1f(u.uTrk,pStart[1]);

/* =====================================================================
   Timeline: every motion runs at one constant speed, with only a brief gentle start and stop.
   ===================================================================== */
function prof(f,r){f=clamp01(f);const vv=1/(1-r);return f<r?0.5*vv*f*f/r:f>1-r?1-0.5*vv*(1-f)*(1-f)/r:vv*(f-r/2);}
// the canopy starts to sag under its own weight while it is still growing, and the sag deepens into the fall to the water:
// no pause anywhere, the bend easing in as gently as it eases out
const VOID=0.9,T_BEND=9.3,T_TOUCH=22.5,phases=[['I · Genesis',12],['II · Bloom',T_TOUCH-12],['III · Torus',Infinity]];
const globalT=()=>ph===0?pt:ph===1?12+pt:T_TOUCH+pt;
let ph=0,pt=0,G=0,t=0;
function updateTimeline(dt){
  let cap;
  if($('auto').checked){
    pt+=dt;while(pt>phases[ph][1]){pt-=phases[ph][1];ph++;}
    const Tg=globalT();
    G=M*prof((Tg-VOID)/(12-VOID),0.3);   // growth slows over exactly the stretch in which the sag gathers: an even pace
    t=Tg<=T_BEND?0:prof((Tg-T_BEND)/(T_TOUCH-T_BEND),0.18);
    $('morph').value=t;cap=phases[ph][0];
    if(ph===0){const k=lev[Math.min(M-1,G|0)];cap+=G<0.05?' · Seed':k===0?' · Trunk':' · Generation '+k+' / '+D;}
    if(ph===2){const P_=(frontS-M)/M;if(P_>0.01)cap+=P_<1.05?' · Return':' · Circulation';}
  }else{G=M;cap='Manual · '+Math.round(t*100)+'%';}
  if(rec)cap+=' · ● Rec';
  $('phase').textContent=cap;
  $('barfill').style.width=(ph===0&&$('auto').checked?G/M:t)*100+'%';
  seedA=ph===0&&$('auto').checked?sm((pt-0.15)/0.6)*(1-sm((G-1.5)/8)):0;
}

/* =====================================================================
   Sound (optional): a generative tone that follows the structure. Each generation adds a
   harmonic; while the tree stands the partials are slightly detuned and gently beat against
   each other; as the torus closes they slide into pure tuning and the root fills in beneath.
   ===================================================================== */
const snd={ctx:null,on:false,
  init(){const A=new (window.AudioContext||window.webkitAudioContext)();this.ctx=A;
    this.master=A.createGain();this.master.gain.value=0;
    this.lp=A.createBiquadFilter();this.lp.type='lowpass';this.lp.frequency.value=400;this.lp.Q.value=0.4;
    const rev=A.createConvolver(),len=A.sampleRate*5.5,buf=A.createBuffer(2,len,A.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
    rev.buffer=buf;const wet=A.createGain(),dry=A.createGain();wet.gain.value=0.55;dry.gain.value=0.7;
    this.lp.connect(dry);this.lp.connect(rev);rev.connect(wet);dry.connect(this.master);wet.connect(this.master);this.master.connect(A.destination);
    const base=55,H=[2,3,4,5,6,8,10,12,15,16,18,20,24,30];
    this.v=H.map((h,i)=>{const o=A.createOscillator();o.type='sine';o.frequency.value=base*h;const g=A.createGain();g.gain.value=0;
      o.connect(g);g.connect(this.lp);o.start();return {o,g,amp:0.3/Math.pow(1+i,0.75)};});
    const so=A.createOscillator();so.type='sine';so.frequency.value=base;this.sub=A.createGain();this.sub.gain.value=0;so.connect(this.sub);this.sub.connect(this.lp);so.start();
    const lfo=A.createOscillator();lfo.frequency.value=0.07;const lg=A.createGain();lg.gain.value=120;lfo.connect(lg);lg.connect(this.lp.frequency);lfo.start();},
  set(on){if(on&&!this.ctx){try{this.init();}catch(e){return;}}if(!this.ctx)return;this.on=on;if(on)this.ctx.resume();
    this.master.gain.setTargetAtTime(on?0.22:0,this.ctx.currentTime,0.6);},
  update(){if(!this.on)return;const T=this.ctx.currentTime;
    this.v.forEach((v_,k)=>{const live=k<=D&&G>pStart[k]+0.5;v_.g.gain.setTargetAtTime(live?v_.amp:0,T,0.9);
      v_.o.detune.setTargetAtTime((1-t)*(k%2?1:-1)*(3+k*1.6),T,0.4);});
    this.sub.gain.setTargetAtTime(0.35*t*t,T,1.2);
    this.lp.frequency.setTargetAtTime(350+3200*Math.pow(G/M,1.4)+1500*t,T,0.8);}};

/* =====================================================================
   Export: a 4K still of the current moment, or a video of the whole sequence
   ===================================================================== */
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
function exportStill(){
  const asp=innerWidth/innerHeight,LONG=3840,W=asp>=1?LONG:Math.round(LONG*asp),H=asp>=1?Math.round(LONG/asp):LONG;
  const keep={w:CW,h:CH,dpr};
  dpr=keep.dpr*W/keep.w;setSize(W,H);
  prepare();render(clock);
  cv.toBlob(b=>{if(b)download(b,'arbor-torus-4k.png');},'image/png');
  dpr=keep.dpr;setSize(keep.w,keep.h);
}
let rec=null,recChunks=[];
const recMime=window.MediaRecorder?['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m)):null;
if(!recMime||!cv.captureStream)$('record').disabled=true;
function startRec(){
  rec=new MediaRecorder(cv.captureStream(30),{mimeType:recMime,videoBitsPerSecond:20e6});recChunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data);};
  rec.onstop=()=>{download(new Blob(recChunks,{type:recMime}),'arbor-torus.'+(recMime.includes('mp4')?'mp4':'webm'));rec=null;$('record').textContent='Record';};
  $('auto').checked=true;ph=0;pt=0;G=0;t=0;boatEpoch=clock;resetBoatFloat();resetFlow();   // record the whole piece from the seed
  rec.start(500);$('record').textContent='Stop';
}
function stopRec(){if(rec&&rec.state!=='inactive')rec.stop();}

/* =====================================================================
   Interaction and presentation mode
   ===================================================================== */
let drag=null,pinch=0,pinchCenter=null,idleT=0;
function wake(){document.body.classList.remove('idle');clearTimeout(idleT);
  idleT=setTimeout(()=>{if(!$('panel').matches(':hover'))document.body.classList.add('idle');},3500);}
['pointermove','pointerdown','wheel','touchstart'].forEach(e=>addEventListener(e,wake,{passive:true}));
addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('noui');wake();});
wake();

  drag={x:e.clientX,y:e.clientY,mode:e.altKey||e.button===1?'pan':e.shiftKey||e.button===2?'roll':'rot'};});

  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(drag.mode==='rot'){ry+=dx*0.01;rxU+=dy*0.01;}
  else if(drag.mode==='roll'){rz+=dx*0.01;}
  else if(drag.mode==='pan'){const r=cv.getBoundingClientRect();viewPanX+=dx/r.width;viewPanY+=dy/r.height;camera(t);}});
addEventListener('pointerup',()=>drag=null);
function zoomAt(next,clientX,clientY){
  camera(t);const r=cv.getBoundingClientRect(),x=(clientX-r.left)/r.width,y=(clientY-r.top)/r.height;
  const target=Math.max(MIN_SCALE,Math.min(MAX_SCALE,next)),ratio=target/scale;
  viewPanX+=(x-ctrX)*(1-ratio);viewPanY+=(y-ctrY)*(1-ratio);
  scale=target;$('scale').value=scale;camera(t);
}
cv.addEventListener('wheel',e=>{
  e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?cv.clientHeight:1;
  zoomAt(scale*Math.exp(-e.deltaY*unit*.001),e.clientX,e.clientY);
},{passive:false});
const touchPair=touches=>({distance:Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY),
  x:(touches[0].clientX+touches[1].clientX)/2,y:(touches[0].clientY+touches[1].clientY)/2});
cv.addEventListener('touchstart',e=>{if(e.touches.length===2){const p=touchPair(e.touches);pinch=p.distance;pinchCenter=p;drag=null;}},{passive:true});
cv.addEventListener('touchmove',e=>{if(e.touches.length===2){
  const p=touchPair(e.touches),r=cv.getBoundingClientRect();
  if(pinch&&pinchCenter){
    viewPanX+=(p.x-pinchCenter.x)/r.width;viewPanY+=(p.y-pinchCenter.y)/r.height;
    zoomAt(scale*p.distance/pinch,p.x,p.y);
  }
  pinch=p.distance;pinchCenter=p;drag=null;e.preventDefault();
}},{passive:false});
const endPinch=()=>{pinch=0;pinchCenter=null;drag=null;};
cv.addEventListener('touchend',endPinch);cv.addEventListener('touchcancel',endPinch);
cv.addEventListener('pointercancel',()=>drag=null);
$('scale').oninput=e=>{const r=cv.getBoundingClientRect();zoomAt(+e.target.value,r.left+r.width/2,r.top+r.height/2);};
$('morph').oninput=e=>{$('auto').checked=false;t=+e.target.value;G=M;};
$('auto').onchange=e=>{if(e.target.checked){G=M;ph=1;pt=Math.max(0,T_BEND+(T_TOUCH-T_BEND)*t-12);}};
['depth','mer','spread','ratio','vari','twist'].forEach(id=>$(id).oninput=buildTree);
$('sound').onchange=e=>snd.set(e.target.checked);
$('regrow').onclick=()=>{$('auto').checked=true;ph=0;pt=0;G=0;t=0;boatEpoch=clock;resetBoatFloat();resetFlow();};
$('lighting').onchange=wake;
$('reseed').onclick=()=>{seed++;buildTree();};
$('reset').onclick=()=>{rxU=0;ry=HOME_VIEW.azimuth;rz=0;yaw=0;scale=HOME_VIEW.scale;viewPanX=0;viewPanY=0;$('scale').value=scale;camera(t);};
$('still').onclick=exportStill;
$('record').onclick=()=>rec?stopRec():startRec();
$('tg').onclick=()=>{const Pn=$('panel');Pn.classList.toggle('hide');const open=!Pn.classList.contains('hide');
  $('tg').textContent=(open?'—':'+')+' Controls';$('tg').setAttribute('aria-expanded',String(open));$('lightingbar').hidden=!open;wake();};

/* =====================================================================
   Main loop
   ===================================================================== */
let preparedShape=null;
function prepare(){
  const hf=+$('hole').value;RT=KZ*fitTree/(2+hf);
  const shapeKey=[treeRevision,t,hf,RT].join(',');
  if(shapeKey!==preparedShape){
    if(GPU){const r=repModel(t);modelMaxY=r.ymax+(ymaxAll0-ymaxRep0)*(1-sm(t/0.55));tipGap=2*r.tip;gpuMorph();}
    else{computeModel(t);tipGap=2*repModel(t).tip;packBranches();}
    preparedShape=shapeKey;
  }
  camera(t);buildPoints();updateBoat();camera(t);
}
buildTree();
let last=performance.now(),clock=0,artVisible=true,frameDeadline=0;
if(typeof IntersectionObserver!=='undefined')new IntersectionObserver(entries=>{artVisible=entries[0].isIntersecting;},{threshold:0}).observe(cv);
function frame(now){
  if(document.hidden||!artVisible){last=now;frameDeadline=now;requestAnimationFrame(frame);return;}
  if(now<frameDeadline){requestAnimationFrame(frame);return;}
  frameDeadline=now+1000/30-.5;
  const dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;
  updateTimeline(dt);
  if($('spin').checked&&!drag)yaw+=dt*0.22;
  prepare();meetStep(dt);junction=frontStep(dt);flowStep(dt);render(clock);snd.update();
  if(rec&&ph===2&&pt>13)stopRec();                   // a recording ends once the ring has begun to circulate
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
